spring:
  application:
    name: application
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  http:
    clients:
      # used by the /notification/** proxy route
      connect-timeout: ${UPSTREAM_CONNECT_TIMEOUT:5s}
      read-timeout: ${UPSTREAM_READ_TIMEOUT:30s}
  datasource:
    # prepareThreshold=0 is required behind a transaction-mode pooler (Supabase/PgBouncer)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:6543}/${DB_NAME:postgres}?prepareThreshold=0&sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # each microservice had its own pool of 3; the monolith shares one pool
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      max-lifetime: 1800000
      # This clears any cached prepared statements before reusing the connection.
      connection-init-sql: "DISCARD ALL"
  jpa:
    # matches local (Boot default): entities like Auction.items are lazy-loaded after the service returns
    open-in-view: true
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  output:
    ansi:
      enabled: NEVER
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:bidder-kafka-bidder.i.aivencloud.com:15237}
    # Aiven: SASL (SCRAM) auth over SSL, trusting Aiven's CA certificate (ca.pem)
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:/etc/secrets/ca.pem}
      ssl.endpoint.identification.algorithm: https

server:
  # Render injects PORT
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      # matches the "/api/*/actuator/**" permitAll rule in SecurityConfig
      base-path: /api/v1/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    com.bidder.application: INFO

# ---------- security + notification proxy ----------
routes:
  # notification-service is not part of the monolith
  notification: ${NOTIFICATION_SERVICE_URL}

whitelist-endpoints:
  - /identity-and-auth/api/v1/auth/login
  - /identity-and-auth/api/v1/auth/register
  - /bidding/api/v1/bid/search
  - /bidding/api/v1/bid/search/item/**
  - /bidding/api/v1/bid/item/*/top-ten-bids
  - /catalog/api/v1/auction/search
  - /catalog/api/v1/item/**
  - /catalog/api/v1/auction/*/items
  - /catalog/api/v1/auction/*/details
  - /catalog/api/v1/auction/view/*

# ---------- security + auth ----------
jwt:
  secret: ${JWT_SECRET}

cookies:
  secure: ${COOKIES_SECURE:true}
  # frontend and API live on different onrender.com subdomains (cross-site), so Lax would drop the cookie
  sameSite: ${COOKIES_SAME_SITE:None}
  httpOnly: ${COOKIES_HTTP_ONLY:true}

client:
  # CORS allowed origins (gateway) and base URL for links in auth emails (identity)
  url: ${CLIENT_URL:https://biddr-frontend.onrender.com}

# ---------- auth ----------
auth:
  registration-pwd:
    allow-simple: false

token-expiry:
  password-reset: 300 # 5mins
  account-verification: 900 # 15mins

# ---------- bids + catalog ----------
client-url: ${CLIENT_URL:https://biddr-frontend.onrender.com}

# ---------- bids ----------
flag:
  runRecomputeHighestBidsAfterBidExpires: ${RUN_RECOMPUTE_HIGHEST_BIDS:true}

# ---------- catalog ----------
feature-flag:
  run-close-auction-schedule-job: false
